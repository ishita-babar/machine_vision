<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Document restoration</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3d8bfd;
      --accent-dim: #2a5f9e;
      --danger: #f07178;
      --ok: #7fd962;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #1e3a5f 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #2a1f3d 0%, transparent 50%),
        var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0 0 0.35rem;
      letter-spacing: -0.02em;
    }
    .sub {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 1.75rem;
    }
    .card {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 1.25rem 1.35rem;
      margin-bottom: 1.25rem;
    }
    label.file-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 1rem;
      background: var(--accent-dim);
      color: var(--text);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      border: 1px solid rgba(255,255,255,0.12);
    }
    label.file-btn:hover { background: var(--accent); }
    input[type="file"] { display: none; }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 1.5rem;
      align-items: center;
      margin-top: 1rem;
    }
    .checks label {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .checks input { accent-color: var(--accent); }
    button.run {
      padding: 0.55rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--bg);
      background: var(--ok);
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button.run:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    button.run:not(:disabled):hover { filter: brightness(1.08); }
    .preview-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 1rem;
    }
    @media (max-width: 720px) {
      .preview-grid { grid-template-columns: 1fr; }
    }
    .preview-box h3 {
      margin: 0 0 0.5rem;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .preview-box img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
      background: #000;
      border: 1px solid rgba(255,255,255,0.08);
      min-height: 120px;
      object-fit: contain;
    }
    .placeholder {
      color: var(--muted);
      font-size: 0.85rem;
      padding: 2rem;
      text-align: center;
      border: 1px dashed rgba(255,255,255,0.15);
      border-radius: 8px;
    }
    .status {
      margin-top: 0.75rem;
      font-size: 0.88rem;
      min-height: 1.25em;
    }
    .status.err { color: var(--danger); }
    .status.ok { color: var(--ok); }
    .filename { font-size: 0.85rem; color: var(--muted); margin-top: 0.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>Adaptive document restoration</h1>
    <p class="sub">Upload a document image. The server runs your OpenCV pipeline and returns a cleaned binary result (PNG).</p>

    <div class="card">
      <form id="form">
        <label class="file-btn">
          <span>Choose image</span>
          <input type="file" id="image" name="image" accept="image/png,image/jpeg,image/bmp,image/tiff,image/webp" />
        </label>
        <p class="filename" id="fname">No file selected</p>

        <div class="row checks">
          <label><input type="checkbox" name="shadow_removal" checked /> Shadow / lighting normalization</label>
          <label><input type="checkbox" name="deskew" checked /> Deskew</label>
          <label><input type="checkbox" name="perspective" /> Perspective unwrap (page outline)</label>
        </div>

        <div class="row">
          <button type="submit" class="run" id="submit" disabled>Restore document</button>
        </div>
      </form>

      <p class="status" id="status" aria-live="polite"></p>
    </div>

    <div class="card">
      <div class="preview-grid">
        <div class="preview-box">
          <h3>Original</h3>
          <div id="orig-wrap"><div class="placeholder">Preview after you choose a file</div></div>
        </div>
        <div class="preview-box">
          <h3>Restored</h3>
          <div id="out-wrap"><div class="placeholder">Result appears here</div></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("image");
    const submit = document.getElementById("submit");
    const statusEl = document.getElementById("status");
    const fname = document.getElementById("fname");
    const origWrap = document.getElementById("orig-wrap");
    const outWrap = document.getElementById("out-wrap");

    let origUrl = null;
    let outUrl = null;

    function setStatus(msg, kind) {
      statusEl.textContent = msg || "";
      statusEl.className = "status" + (kind ? " " + kind : "");
    }

    function revoke(url) {
      if (url) URL.revokeObjectURL(url);
    }

    input.addEventListener("change", () => {
      revoke(origUrl);
      revoke(outUrl);
      outUrl = null;
      outWrap.innerHTML = '<div class="placeholder">Result appears here</div>';
      const f = input.files[0];
      if (!f) {
        fname.textContent = "No file selected";
        origWrap.innerHTML = '<div class="placeholder">Preview after you choose a file</div>';
        submit.disabled = true;
        return;
      }
      fname.textContent = f.name + " (" + (f.size / 1024).toFixed(1) + " KB)";
      origUrl = URL.createObjectURL(f);
      origWrap.innerHTML = "";
      const img = document.createElement("img");
      img.src = origUrl;
      img.alt = "Original upload";
      origWrap.appendChild(img);
      submit.disabled = false;
      setStatus("");
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const f = input.files[0];
      if (!f) return;

      const fd = new FormData();
      fd.append("image", f);
      fd.append("shadow_removal", form.shadow_removal.checked ? "1" : "0");
      fd.append("deskew", form.deskew.checked ? "1" : "0");
      fd.append("perspective", form.perspective.checked ? "1" : "0");

      submit.disabled = true;
      setStatus("Processing…", "ok");

      try {
        const res = await fetch("/restore", { method: "POST", body: fd });
        if (!res.ok) {
          let err = res.statusText;
          try {
            const j = await res.json();
            if (j.error) err = j.error;
          } catch (_) {}
          throw new Error(err);
        }
        const blob = await res.blob();
        revoke(outUrl);
        outUrl = URL.createObjectURL(blob);
        outWrap.innerHTML = "";
        const img = document.createElement("img");
        img.src = outUrl;
        img.alt = "Restored document";
        outWrap.appendChild(img);
        setStatus("Done.", "ok");
      } catch (err) {
        setStatus(err.message || "Request failed", "err");
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
